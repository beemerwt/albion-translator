[project]
name = "albion-translator-sidecar"
version = "0.1.0"
description = "Local translation REST sidecar for albion-translator"
requires-python = ">=3.11"
dependencies = [
    "argostranslate>=1.9,<2.0",
    "fastapi>=0.115,<1.0",
    "langdetect>=1.0.9,<2.0",
    "pydantic>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[tool.uvicorn]
host = "127.0.0.1"
port = 8787
